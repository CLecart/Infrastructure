# Local environment of the movies application, built from the recipes of the
# repository. Service names, resource limits and hardening are those of the
# Kubernetes manifests, and each flow the NetworkPolicies allow
# (repos/infra/platform/network-policies.yaml) gets its own network:
#
#   host 127.0.0.1:3000 -> api-gateway:3000                 edge
#   api-gateway   -> inventory-app:8080                     inventory-api
#   api-gateway   -> rabbitmq:5672                          billing-publish
#   billing-app   -> rabbitmq:5672                          billing-consume
#   inventory-app -> inventory-db:5432                      inventory-data
#   billing-app   -> billing-db:5432                        billing-data
#
# Every network but edge is internal: no route out of the host. Two services
# talk only if they share a network.
#
#   cp .env.example .env    # then replace every CHANGE_ME
#   docker compose up -d --build --wait
#   Scripts/compose-test.sh
name: movies

x-hardening: &hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: on-failure
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  inventory-db:
    <<: *hardening
    build: repos/infra/images/inventory-database
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: ${INVENTORY_DB_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?copy .env.example to .env}
      # Defaults of psql: `docker compose exec <db> psql` opens the database.
      PGUSER: ${INVENTORY_DB_USER:?copy .env.example to .env}
      PGDATABASE: movies
    volumes:
      - inventory-db:/var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:uid=70,gid=70,mode=0700
      - /tmp:uid=70,gid=70,mode=0700
    networks: [inventory-data]
    stop_grace_period: 30s
    deploy:
      resources:
        reservations: { cpus: "0.1", memory: 128M }
        limits: { cpus: "0.5", memory: 384M }

  billing-db:
    <<: *hardening
    build: repos/infra/images/billing-database
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: ${BILLING_DB_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD:?copy .env.example to .env}
      # Defaults of psql: `docker compose exec <db> psql` opens the database.
      PGUSER: ${BILLING_DB_USER:?copy .env.example to .env}
      PGDATABASE: billing_db
    volumes:
      - billing-db:/var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:uid=70,gid=70,mode=0700
      - /tmp:uid=70,gid=70,mode=0700
    networks: [billing-data]
    stop_grace_period: 30s
    deploy:
      resources:
        reservations: { cpus: "0.1", memory: 128M }
        limits: { cpus: "0.5", memory: 384M }

  rabbitmq:
    <<: *hardening
    build: repos/infra/images/rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
      # RabbitMQ sizes its memory alarm from the RAM of the host, not from the
      # container limit: without this override (512 MiB, the limit below) it
      # would be OOM-killed before its flow control kicks in.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit total_memory_available_override_value 536870912
    volumes:
      # Node database and message store: the queue survives a restart.
      - rabbitmq:/var/lib/rabbitmq
    tmpfs:
      # rabbitmq.conf, generated by the entrypoint at every start.
      - /etc/rabbitmq:uid=100,gid=101,mode=0755
    networks: [billing-publish, billing-consume]
    stop_grace_period: 60s
    deploy:
      resources:
        reservations: { cpus: "0.1", memory: 192M }
        limits: { cpus: "1", memory: 512M }

  inventory-app:
    <<: *hardening
    build: repos/inventory-app
    environment:
      DB_HOST: inventory-db
      DB_NAME: movies
      DB_USER: ${INVENTORY_DB_USER:?copy .env.example to .env}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?copy .env.example to .env}
    depends_on:
      inventory-db: { condition: service_healthy }
    networks: [inventory-api, inventory-data]
    deploy:
      resources:
        reservations: { cpus: "0.1", memory: 64M }
        limits: { cpus: "0.5", memory: 256M }

  billing-app:
    <<: *hardening
    build: repos/billing-app
    environment:
      DB_HOST: billing-db
      DB_NAME: billing_db
      DB_USER: ${BILLING_DB_USER:?copy .env.example to .env}
      DB_PASSWORD: ${BILLING_DB_PASSWORD:?copy .env.example to .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?copy .env.example to .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
    depends_on:
      billing-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [billing-consume, billing-data]
    deploy:
      resources:
        reservations: { cpus: "0.05", memory: 64M }
        limits: { cpus: "0.25", memory: 256M }

  # Does not wait for billing-app: orders queue up in RabbitMQ while it is down.
  api-gateway:
    <<: *hardening
    build: repos/api-gateway-app
    environment:
      INVENTORY_APP_URL: http://inventory-app:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?copy .env.example to .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
    ports:
      # Loopback only: the stack is not reachable from the network.
      - "127.0.0.1:${API_GATEWAY_PORT:-3000}:3000"
    volumes:
      - api-gateway-logs:/var/logs/api-gateway
    depends_on:
      inventory-app: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [edge, inventory-api, billing-publish]
    deploy:
      resources:
        reservations: { cpus: "0.1", memory: 64M }
        limits: { cpus: "0.5", memory: 256M }

networks:
  edge: {}
  inventory-api: { internal: true }
  inventory-data: { internal: true }
  billing-publish: { internal: true }
  billing-consume: { internal: true }
  billing-data: { internal: true }

volumes:
  inventory-db: {}
  billing-db: {}
  rabbitmq: {}
  api-gateway-logs: {}
