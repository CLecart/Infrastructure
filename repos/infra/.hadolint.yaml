# hadolint configuration (https://github.com/hadolint/hadolint) of the images/
# recipes, read by the local gate of the Infrastructure repository: no CI job
# lints them.
ignored:
  # DL3018 "Pin versions in apk add": Alpine repositories only serve the latest build of a
  # package for a given branch, so `apk add pkg=x.y.z-r0` breaks the build as soon as the
  # package is updated. The base image (alpine:3.23) fixes the Alpine branch; each build takes the
  # latest build of each package in it, security fixes included (apk upgrade).
  - DL3018
  # DL3066 "Non-numeric user-id": USER is kept symbolic (postgres, rabbitmq) for
  # readability; their Alpine packages create them with fixed uids (70, 100).
  - DL3066
