# Pipeline of the infrastructure (movies/infra): Terraform of the staging
# and production environments, then their platform layer (databases, RabbitMQ,
# monitoring).
#
#   images -> init -> validate -> plan -> apply-staging -> approval -> apply-production
#
# validate checks the syntax and formatting of the Terraform code (terraform
# validate and fmt) and its best practices: TFLint (.tflint.hcl) and the Trivy
# security scan (.trivyignore.yaml). It runs in every pipeline, with no AWS access.
#
# - Push on main (protected): creates or updates both environments. The
#   production stages wait until a Maintainer (stakeholder) runs the manual job
#   approve-production: only users allowed to merge into main may run it.
# - Merge request: init without backend and the validate stage only, with no
#   AWS access.
# - Push on another branch: the validate stage only (no AWS access), unless a
#   merge request already runs a pipeline for that branch.
# - "Run pipeline" on main with DESTROY=true (only Maintainers may set a
#   variable): the same stages delete both environments, production after approval.
#
# AWS access: each job exchanges its ID token for the role of this project
# (OIDC, role movies-ci-infra), which only the main branch may assume.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - images
  - init
  - validate
  - plan
  - apply-staging
  - approval
  - apply-production

variables:
  DESTROY:
    value: "false"
    options: ["false", "true"]
    description: "true deletes both environments (end of a work session)."
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform-plugins"
  # scripts/image-tag.sh reads the history of images/.
  GIT_DEPTH: "0"
  # Tools of the jobs, at the versions of the Pile line (README): the AWS CLI
  # image by digest; kubectl, Helm, the Docker client and buildx checked
  # against their SHA-256 (official releases), updated by hand as Renovate
  # cannot recompute them; git from the Amazon Linux release of that image.
  AWS_CLI_IMAGE: public.ecr.aws/aws-cli/aws-cli:2.38.2@sha256:5d39fd52f236ed01c5c25fba66c9aebcfc6cbb88e7bb1b727c5fe1f150540597
  KUBECTL_VERSION: "1.36.4"
  KUBECTL_SHA256: 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
  HELM_VERSION: "4.3.1"
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
  DOCKER_VERSION: "29.10.0"
  DOCKER_SHA256: 7c1ebadc65c716cdc6d35fc78759ed0e4317debf43c21dd12f066f2006999def
  BUILDX_VERSION: "0.39.0"
  BUILDX_SHA256: 5fb31a097304fbf6dd4038649a0decf32c2b9510e4047acd7d68b9d700c46194

default:
  image:
    name: public.ecr.aws/hashicorp/terraform:1.16.6@sha256:bfffc1ded5fbf0a17beaaf22eb4793980abdb19d0761ff6a3a0efb2ab4d9b316
    entrypoint: [""]

# ---- building blocks ---------------------------------------------------------

.on-main: &on-main
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"

# OIDC: AWS reads the ID token from a file, AWS_ROLE_ARN and AWS_REGION come
# from the protected CI variables of the project and of the group.
.aws:
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - printf '%s' "$AWS_ID_TOKEN" > /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token
    - export AWS_ROLE_SESSION_NAME="gitlab-${CI_PROJECT_NAME}-${CI_JOB_ID}"

.terraform-cache:
  cache:
    key:
      files:
        - terraform/envs/staging/.terraform.lock.hcl
        - terraform/envs/prod/.terraform.lock.hcl
    paths:
      - .terraform-plugins

# Terraform of one environment ($ENV), state in the S3 bucket of bootstrap/.
.terraform:
  extends: [.aws, .terraform-cache]
  before_script:
    - !reference [.aws, before_script]
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - terraform -chdir="terraform/envs/$ENV" init -backend-config="bucket=$TF_STATE_BUCKET"

# AWS CLI, kubectl and Helm for the platform layer ($ENV).
.kubernetes:
  extends: .aws
  image:
    name: $AWS_CLI_IMAGE
    entrypoint: [""]
  before_script:
    - !reference [.aws, before_script]
    # kubectl and Helm at the versions of the Pile line (README), from their
    # official releases, each checked against its SHA-256 written in the variables.
    - curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - echo "${KUBECTL_SHA256}  /usr/local/bin/kubectl" | sha256sum -c -
    - chmod 0755 /usr/local/bin/kubectl
    - curl -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
    - echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
    - python3 -c 'import tarfile; open("/usr/local/bin/helm", "wb").write(tarfile.open("/tmp/helm.tar.gz").extractfile("linux-amd64/helm").read())'
    - chmod 0755 /usr/local/bin/helm

# ---- images ------------------------------------------------------------------

# Builds, scans (Trivy) and pushes the database and RabbitMQ images that are
# not in ECR yet; their tags go to the deployment jobs (dotenv report).
build-platform-images:
  stage: images
  image:
    name: $AWS_CLI_IMAGE
    entrypoint: [""]
  tags: [docker-build]
  extends: .aws
  before_script:
    - !reference [.aws, before_script]
    # Docker client and buildx at the versions of the Pile line (README), from
    # their official releases, each checked against its SHA-256; the daemon is
    # the one of the builder runner (socket).
    - curl -fsSLo /tmp/docker.tgz "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz"
    - echo "${DOCKER_SHA256}  /tmp/docker.tgz" | sha256sum -c -
    - python3 -c 'import tarfile; open("/usr/local/bin/docker", "wb").write(tarfile.open("/tmp/docker.tgz").extractfile("docker/docker").read())'
    - chmod 0755 /usr/local/bin/docker
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - curl -fsSLo /usr/local/lib/docker/cli-plugins/docker-buildx "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
    - echo "${BUILDX_SHA256}  /usr/local/lib/docker/cli-plugins/docker-buildx" | sha256sum -c -
    - chmod 0755 /usr/local/lib/docker/cli-plugins/docker-buildx
    # git for scripts/image-tag.sh: dnf follows the Amazon Linux release of the
    # image, so its version is fixed by the digest of the image.
    - dnf -q install -y git
  script:
    - scripts/build-images.sh
  artifacts:
    reports:
      dotenv: images.env
  rules:
    - if: $DESTROY == "true"
      when: never
    - *on-main

# ---- init / validate ----------------------------------------------------------

# Downloads the providers and modules and checks the access to the state backend.
init:
  stage: init
  extends: .terraform-cache
  script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - |
      for env in staging prod; do
        echo "== $env"
        terraform -chdir="terraform/envs/$env" init -backend=false
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

init-backend:
  stage: init
  extends: [.aws, .terraform-cache]
  script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - |
      for env in staging prod; do
        echo "== $env"
        terraform -chdir="terraform/envs/$env" init -backend-config="bucket=$TF_STATE_BUCKET"
      done
  rules:
    - *on-main

# Syntax, formatting and consistency of both environments (no AWS access).
validate:
  stage: validate
  extends: .terraform-cache
  script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - terraform fmt -check -recursive -diff terraform
    - |
      for env in staging prod; do
        echo "== $env"
        terraform -chdir="terraform/envs/$env" init -backend=false
        terraform -chdir="terraform/envs/$env" validate
      done

# Terraform best practices that validate does not check (.tflint.hcl): unused
# declarations, pinned module and provider versions, typed variables...
tflint:
  stage: validate
  image:
    name: ghcr.io/terraform-linters/tflint:v0.64.0@sha256:1c595f42d794c32c45a6ea8b58655fd66433d4ca3b1bc631c574a48d120bd19f
    entrypoint: [""]
  script:
    # Logs the ruleset in use (terraform, bundled): the lint prints nothing when
    # it finds nothing.
    - tflint --version
    # Absolute path: with --recursive, a relative --config is looked up in each
    # module directory.
    - tflint --chdir=terraform --recursive --config="$CI_PROJECT_DIR/.tflint.hcl"

# Security best practices (Trivy): fails on a HIGH or CRITICAL misconfiguration
# that .trivyignore.yaml does not accept, in our code and in the registry
# modules (vpc, eks), which Trivy downloads to follow the module calls.
# --skip-check-update: the checks built into this Trivy version, so a commit
# gets the same result in every pipeline, a destroy included; Trivy then logs
# "Falling back to embedded checks" as an error, which is expected.
# --skip-dirs: after a local terraform init, Trivy would read the modules from
# .terraform, under other paths than those of .trivyignore.yaml.
iac-scan:
  stage: validate
  variables:
    # A variable, as in the application pipelines: the Renovate custom manager
    # updates it.
    TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  script:
    - trivy config --skip-check-update --skip-dirs "**/.terraform" --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml terraform/

# ---- plan --------------------------------------------------------------------

.plan:
  stage: plan
  extends: .terraform
  script:
    - |
      if [ "$DESTROY" = "true" ]; then mode="-destroy"; else mode=""; fi
      terraform -chdir="terraform/envs/$ENV" plan $mode -out=plan.tfplan
      terraform -chdir="terraform/envs/$ENV" show -no-color plan.tfplan > "terraform/envs/$ENV/plan.txt"
  artifacts:
    paths:
      - terraform/envs/$ENV/plan.tfplan
      - terraform/envs/$ENV/plan.txt
    expire_in: 1 day
  rules:
    - *on-main

plan-staging:
  extends: .plan
  variables:
    ENV: staging

plan-production:
  extends: .plan
  variables:
    ENV: prod

# ---- apply -------------------------------------------------------------------

.not-destroy: &not-destroy
  if: $DESTROY == "true"
  when: never

.destroy-on-main: &destroy-on-main
  if: $DESTROY == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"

# Applies exactly the plan of the plan stage, then gives the public URL of the
# environment to GitLab (Operate > Environments).
.apply:
  extends: .terraform
  timeout: 45m
  script:
    - terraform -chdir="terraform/envs/$ENV" apply plan.tfplan
    - echo "API_URL=$(terraform -chdir="terraform/envs/$ENV" output -raw api_url)" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - *not-destroy
    - *on-main

# Platform layer after a creation or an update.
.deploy-platform:
  extends: .kubernetes
  timeout: 30m
  script:
    - scripts/deploy-platform.sh "$ENV"
  rules:
    - *not-destroy
    - *on-main

# Deletion: the namespace and its EBS volumes go first, while the cluster still
# runs (scripts/remove-platform.sh), then terraform destroys the environment.
.remove-platform:
  extends: .kubernetes
  script:
    - scripts/remove-platform.sh "$ENV"
  rules:
    - *destroy-on-main

# The destroy plan is computed again in the job: after an interrupted destroy,
# a Retry then works (Terraform refuses a saved plan once the state has
# changed). The plan of the plan stage remains the one to review.
.destroy:
  extends: .terraform
  timeout: 45m
  script:
    - terraform -chdir="terraform/envs/$ENV" plan -destroy -lock-timeout=5m -out=destroy.tfplan
    - terraform -chdir="terraform/envs/$ENV" apply -lock-timeout=5m destroy.tfplan
  rules:
    - *destroy-on-main

apply-staging:
  stage: apply-staging
  extends: .apply
  variables:
    ENV: staging
  resource_group: staging
  needs:
    - plan-staging
  environment:
    name: staging
    url: $API_URL

deploy-platform-staging:
  stage: apply-staging
  extends: .deploy-platform
  variables:
    ENV: staging
  resource_group: staging
  needs:
    - apply-staging
    - build-platform-images
  environment:
    name: staging
    action: prepare

remove-platform-staging:
  stage: apply-staging
  extends: .remove-platform
  variables:
    ENV: staging
  resource_group: staging
  needs:
    - plan-staging
  environment:
    name: staging
    action: prepare

destroy-staging:
  stage: apply-staging
  extends: .destroy
  variables:
    ENV: staging
  resource_group: staging
  needs:
    - plan-staging
    - remove-platform-staging
  environment:
    name: staging
    action: stop

# ---- approval ----------------------------------------------------------------

# Manual gate before production: running a manual job of main needs the right
# to merge into main, so only the Maintainers (stakeholder, clecart) can approve.
approve-production:
  stage: approval
  image: public.ecr.aws/docker/library/alpine:3.23@sha256:469c9ea410b9215eaee7976ba6c0639039b444be8e5d638f7abbada189971eb2
  script:
    - echo "Production approved by $GITLAB_USER_LOGIN (DESTROY=$DESTROY)"
  needs:
    - job: deploy-platform-staging
      optional: true
    - job: destroy-staging
      optional: true
  when: manual
  allow_failure: false
  rules:
    - *on-main

# ---- production --------------------------------------------------------------

apply-production:
  stage: apply-production
  extends: .apply
  variables:
    ENV: prod
  resource_group: production
  needs:
    - approve-production
    - plan-production
  environment:
    name: production
    url: $API_URL

deploy-platform-production:
  stage: apply-production
  extends: .deploy-platform
  variables:
    ENV: prod
  resource_group: production
  needs:
    - apply-production
    - build-platform-images
  environment:
    name: production
    action: prepare

remove-platform-production:
  stage: apply-production
  extends: .remove-platform
  variables:
    ENV: prod
  resource_group: production
  # The production plan must have succeeded too: its data is deleted here, and
  # destroy-production needs it.
  needs:
    - approve-production
    - plan-production
  environment:
    name: production
    action: prepare

destroy-production:
  stage: apply-production
  extends: .destroy
  variables:
    ENV: prod
  resource_group: production
  needs:
    - approve-production
    - plan-production
    - remove-platform-production
  environment:
    name: production
    action: stop
