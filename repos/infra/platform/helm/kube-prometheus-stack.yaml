# Values of the kube-prometheus-stack chart (Prometheus, Grafana, kube-state-metrics,
# node-exporter and their dashboards), installed by scripts/deploy-platform.sh as the
# "monitoring" release in the "monitoring" namespace.
#
# Everything stays inside the cluster: Grafana is opened with scripts/grafana.sh
# (kubectl port-forward), never through a public address. Amazon Managed Grafana
# would need the paid AWS plan.

# EKS runs the control plane itself: etcd, the scheduler and the controller
# manager cannot be scraped from the worker nodes.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
# kube-proxy metrics are not needed for this project.
kubeProxy:
  enabled: false

# No alerting in this project.
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # The operator reads the version of Prometheus from the tag: the digest
    # goes in its own field (rendered as @sha256:<sha>), the tag stays the
    # chart's v3.15.0-distroless.
    image:
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    # The cluster lives one work session: no persistent volume (an EBS volume
    # would outlive `terraform destroy`), and one day of data at most.
    retention: 1d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

grafana:
  image:
    tag: 13.2.4-distroless@sha256:ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
  # The test pod of `helm test` is never run here: its image would be pulled for nothing.
  testFramework:
    enabled: false
  # No adminPassword: the chart generates a random one, stored in the
  # monitoring-grafana Secret (scripts/grafana.sh prints it).
  persistence:
    enabled: false
  # The chart adds an Alertmanager data source even when Alertmanager is
  # disabled; it would point to a missing service ("Could not load firing alerts").
  sidecar:
    image:
      tag: 2.14.1@sha256:092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
    datasources:
      alertmanager:
        enabled: false
  # Grafana 13 was OOMKilled with a 256Mi limit while loading a dashboard.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# Every image the chart pulls, by the digest of its multi-arch index (the tag
# kept in front for reading); Renovate keeps them up to date. The operator
# passes the config-reloader and Thanos images to the pods it creates.
prometheusOperator:
  image:
    tag: v0.94.1@sha256:7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
  prometheusConfigReloader:
    image:
      tag: v0.94.1@sha256:06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
  thanosImage:
    tag: v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
  admissionWebhooks:
    patch:
      image:
        tag: 1.11.0@sha256:778d97dc3986355625e14392419b3364c487a7c807d4d86ddad1df369129b082

kube-state-metrics:
  image:
    tag: v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b

# The chart appends -distroless after the tag (v1.12.1, its own): the digest
# goes in its own field, rendered after that suffix.
prometheus-node-exporter:
  image:
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
